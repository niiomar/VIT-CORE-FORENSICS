name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps for OpenCV
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender1 libgl1

      - name: Install Python deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile main.py model.py auth.py audit.py ratelimit.py version.py observability.py export_audit_log.py

      - name: Smoke test (CPU, untrained weights)
        run: python -m pytest tests/ -v

      - name: Dependency vulnerability scan (pip-audit)
        # Informational: the torch/opencv/numpy dependency chain regularly
        # carries upstream CVEs with no available fix, which would make this
        # a permanently-red, unactionable gate if it failed the build.
        # Findings still show up in the Actions log for review.
        continue-on-error: true
        run: |
          pip install pip-audit -q
          pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_API_KEY: ci-placeholder-key

      - name: Test
        run: npm test

      - name: Dependency vulnerability scan (npm audit)
        # Informational, same reasoning as pip-audit on the backend job —
        # see that step's comment.
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    # Building/running the image was previously only ever checked by
    # reading the Dockerfile, never by actually running it — that let a
    # broken base-image pin, a wrong COPY source path, and two mismatched
    # volume-mount paths ship unnoticed. This job builds and boots the real
    # image on every push so that class of bug fails CI instead of being
    # discovered manually.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VITE_API_KEY=ci-placeholder-key -t vitcore-forensics-ci .

      - name: Run container (no real weights — same untrained-model path as the backend smoke test)
        run: docker run -d --name ci-test -p 8000:8000 -e API_KEY=ci-placeholder-key vitcore-forensics-ci

      - name: Wait for /health
        run: timeout 60 bash -c 'until curl -sf http://localhost:8000/health; do sleep 2; done'

      - name: Show logs
        if: always()
        run: docker logs ci-test
